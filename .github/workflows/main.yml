name: Publicar portfólio no GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Impede publicações simultâneas, sem cancelar um deploy já em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Validar e gerar o site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar build de produção
        run: npm run build
        env:
          DEPLOY_TARGET: github-pages

      - name: Verificar ativação do GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/pages")

          if [ "$status" = "404" ]; then
            echo "::error::GitHub Pages não está ativado. Abra Settings > Pages > Build and deployment > Source, selecione GitHub Actions e execute este workflow novamente."
            exit 1
          fi

          if [ "$status" != "200" ]; then
            echo "::error::Não foi possível consultar o GitHub Pages (HTTP $status)."
            cat /tmp/pages.json
            exit 1
          fi

          build_type=$(node -p "JSON.parse(require('fs').readFileSync('/tmp/pages.json', 'utf8')).build_type || ''")
          if [ "$build_type" != "workflow" ]; then
            echo "::error::GitHub Pages está ativado, mas a fonte atual é '$build_type'. Em Settings > Pages > Build and deployment > Source, selecione GitHub Actions."
            exit 1
          fi

      - name: Configurar GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Enviar arquivos do site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Publicar site
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
